name: Deploy simple-app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/simple-app
  DOCKER_IMAGE_TAG: ${{ github.sha }}

jobs:
  app-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Upgrage PIP and install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install flake8 pytest httpx2
          pip3 install -r ./app/requirements.txt
      
      - name: Run Flake8
        run: flake8 ./app
      
      - name: Run Pytest
        run: pytest -v ./app
  
  scripts-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install shellcheck
        run: |
          sudo apt update
          sudo apt install -y shellcheck
      
      - name: Run shellcheck
        run: shellcheck ./scripts/server-info.sh

  build:
    runs-on: ubuntu-22.04
    needs: [app-tests, scripts-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Build image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} .

      - name: Login in DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
      
      - name: Push to registry
        run: docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

      # - name: Login in DockerHub
      #   uses: docker/login-action@v3
