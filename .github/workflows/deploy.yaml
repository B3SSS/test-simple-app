name: Deploy simple-app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# env:
  # DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/simple-app
  # DOCKER_IMAGE_TAG: ${{ github.sha }}

jobs:
  app-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Upgrage PIP and install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install flake8 pytest httpx2
          pip3 install -r ./app/requirements.txt
      
      - name: Run Flake8
        run: flake8 ./app
      
      - name: Run Pytest
        run: pytest -v ./app
  
  shell-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install shellcheck
        run: |
          apt update
          apt install -y shellcheck
      
      - name: Run shellcheck
        run: shellcheck ./scripts/server-info.sh

