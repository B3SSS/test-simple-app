name: Deploy simple-app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: simple-app

jobs:
  simple-job:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r ./app/requirements.txt
      
      - name: Install shellcheck
        run: sudo apt update && sudo apt install -y shellcheck

      - name: Lint Bash scripts (shellcheck)
        run: shellcheck ./scripts/*.sh

      - name: Run tests
        run: pytest -v ./app

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t simple-app:latest .
      
      - name: Run container
        run: docker run -d -p 5000:5000 simple-app:latest
      
      - name: Test container health
        run: sleep 10 && curl -f http://localhost:5000/health  